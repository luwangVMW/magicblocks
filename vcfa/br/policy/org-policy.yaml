apiVersion: policy.management.kubernetes.vmware.com/v1alpha1
kind: ClusterPolicy
metadata:
  name: my-org-policy-2
  namespace: '@org'
spec:
  clusterPolicySchemaRef:
    name: vksm-require-labels:custom-policy
    namespace: '@org'
  input:
    enforcementAction: warn
    targetKubernetesResources:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    parameters:
      labels:
        - key: env3
---
apiVersion: infrastructure.cci.vmware.com/v1alpha2
kind: SupervisorNamespaceClassConfig
metadata:
  name: test-class-config
spec:
  vmClasses:
    - name: best-effort-xsmall
  storageClasses:
    - name: wcpglobal_storage_profile
      limit: 1024Mi
  contentSources: []
  zones:
    - name: '*'
      cpuLimit: 1000M
      cpuReservation: 0M
      memoryLimit: 1024Mi
      memoryReservation: 0Mi
