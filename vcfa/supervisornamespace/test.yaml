apiVersion: infrastructure.cci.vmware.com/v1alpha3
kind: SupervisorNamespace
metadata:
  generateName: tiny-ns
  namespace: argocd-project
spec:
  classConfigOverrides:
    storageClasses:
    - limit: 10240Mi
      name: wcpglobal_storage_profile
    zones:
    - cpuLimit: 1000M
      cpuReservation: 0M
      memoryLimit: 5120Mi
      memoryReservation: 0Mi
      name: domain-c10
  className: tiny
  description: ""
  regionName: argocd
  vpcName: default-argocd
